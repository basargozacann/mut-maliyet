const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function ac(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(V.s),iterations:V.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
 const z=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V.i)},k,u(V.c));
 const h=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 try{const r=new Uint8Array(await crypto.subtle.exportKey("raw",k));sessionStorage.setItem("mutMaliyetK",btoa(String.fromCharCode(...r)))}catch(x){}
 document.open();document.write(h);document.close();}
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById("p").value;b.disabled=true;b.textContent="Açılıyor…";
 try{await ac(pw);try{if(document.getElementById("h")?.checked!==false)localStorage.setItem("mutMaliyet",pw)}catch(x){}}
 catch(x){b.disabled=false;b.textContent="Aç";e.textContent="Parola yanlış ya da tarayıcı desteklemiyor.";}};
(async()=>{let pw=null;try{pw=localStorage.getItem("mutMaliyet")}catch(x){} if(pw){b.textContent="Açılıyor…";try{const keep=pw;await ac(pw);try{localStorage.setItem("mutMaliyet",keep)}catch(x){}}catch(x){try{localStorage.removeItem("mutMaliyet")}catch(y){} b.textContent="Aç";}}})();
